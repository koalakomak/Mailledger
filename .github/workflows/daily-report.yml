name: MailLedger Daily Summary

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: Kirim ringkasan (daily)
        run: |
          curl -fsS -m 240 -X GET \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "https://mailledger.vercel.app/api/reports/summary?period=daily" \
            || echo "::warning::Ringkasan daily gagal dikirim"
