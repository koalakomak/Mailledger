name: MailLedger Auto Sync

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  trigger-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil endpoint sync MailLedger
        run: |
          curl -fsS -m 240 -X GET             -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"             "https://mailledger.vercel.app/api/cron/sync"             || echo "::warning::Sync request gagal (periksa secret & URL)"
